<body>

<table border="1">

    <thead>
        <tr>
            <th>ID</th>
            <th>書名</th>
            <th>作者</th>
		
        </tr>
    </thead>

	<tbody>
		<!--model.addAttribute("books",Allbooks);-->
		<!--  <tr th:each="幫迴圈取的變數 : ${Controller中準備好要傳過來的資料(Allbooks)}"> -->
	    <tr th:each="book : ${books}">
	        <td th:text="${book.ID}"></td>
	        <td th:text="${book.Name}"></td>
	        <td th:text="${book.Author}"></td>
			<td><a href="${}">編輯</a></td>
			<td><form th:action="@{/DeleteBooks/{id}(id=${book.ID})}" method="post">
			  <button type="submit">刪除</button>
			</form></td>
	    </tr>
		<a th:href="@{/AddBooks}"><button>新增書籍</button></a>
	</tbody>
</table>

</body>
</html>
